<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win Go - Color Prediction Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 450px; background: #1e293b; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; position: relative; }
        
        /* AUTH SCREEN */
        .auth-container { display: flex; flex-direction: column; justify-content: center; min-height: 80vh; gap: 15px; }
        .auth-box { background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 12px; }
        .auth-box h2 { text-align: center; margin-bottom: 15px; color: #3b82f6; }
        .auth-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
        .auth-btn { width: 100%; padding: 12px; background: #22c55e; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* GAME DASHBOARD */
        #game-screen { display: none; }
        
        /* WALLET CARD */
        .wallet-card { background: linear-gradient(135deg, #3b82f6, #1d4ed8); padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .wallet-title { font-size: 13px; color: #93c5fd; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
        .balance-amount { font-size: 28px; font-weight: bold; margin: 8px 0; }
        .wallet-btns { display: flex; gap: 10px; margin-top: 15px; }
        .w-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .recharge-btn { background: #22c55e; color: white; }
        .withdraw-btn { background: #e11d48; color: white; }

        /* TIMER BOX */
        .timer-card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .period-info div:first-child { font-size: 12px; color: #94a3b8; }
        .period-info div:last-child { font-size: 16px; font-weight: bold; color: #f59e0b; margin-top: 4px; }
        .countdown { font-size: 24px; font-weight: bold; color: #ef4444; background: #1e293b; padding: 5px 12px; border-radius: 8px; border: 1px solid #334155; }

        /* COLOR BET BUTTONS */
        .color-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .c-btn { flex: 1; padding: 12px 0; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; }
        .btn-green { background: #16a34a; box-shadow: 0 4px #15803d; }
        .btn-violet { background: #9333ea; box-shadow: 0 4px #7e22ce; }
        .btn-red { background: #dc2626; box-shadow: 0 4px #b91c1c; }

        /* NUMBERS GRID */
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .num-btn { padding: 12px 0; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; color: white; cursor: pointer; background: #334155; }
        .num-0 { background: linear-gradient(135deg, #dc2626 50%, #9333ea 50%); }
        .num-5 { background: linear-gradient(135deg, #16a34a 50%, #9333ea 50%); }
        .num-green { background: #16a34a; }
        .num-red { background: #dc2626; }

        /* HISTORY TABLE */
        .history-title { font-size: 14px; font-weight: bold; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; }
        .history-table { width: 100%; border-collapse: collapse; background: #0f172a; border-radius: 10px; overflow: hidden; font-size: 13px; }
        .history-table th, .history-table td { padding: 10px; text-align: center; border-bottom: 1px solid #1e293b; }
        .history-table th { background: #1e293b; color: #94a3b8; }
        .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; }

        /* MODAL POPUP */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #1e293b; width: 85%; max-width: 350px; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #334155; }
        .amount-options { display: flex; gap: 8px; justify-content: center; margin: 15px 0; }
        .amt-btn { padding: 6px 12px; background: #334155; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; }
        .amt-btn.active { background: #3b82f6; }
        .confirm-btn { width: 100%; padding: 10px; background: #22c55e; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- LOGIN / SIGNUP SCREEN -->
        <div id="auth-screen" class="auth-container">
            <div class="auth-box">
                <h2 id="auth-title">Member Login</h2>
                <input type="text" id="auth-userid" class="auth-input" placeholder="User ID">
                <input type="password" id="auth-password" class="auth-input" placeholder="Password">
                <button class="auth-btn" id="main-auth-btn" onclick="handleAuth()">Login</button>
                <p style="font-size:12px; text-align:center; margin-top:15px; cursor:pointer; color:#94a3b8;" onclick="toggleAuthMode()" id="toggle-auth-text">New Member? Register Here</p>
            </div>
        </div>

        <!-- GAME DASHBOARD -->
        <div id="game-screen">
            <!-- WALLET -->
            <div class="wallet-card">
                <div class="wallet-title">
                    <span>Available Balance</span>
                    <span id="user-display-id" style="font-weight:bold; color:#fff;"></span>
                </div>
                <div class="balance-amount">₹ <span id="user-balance">1000.00</span></div>
                <div class="wallet-btns">
                    <button class="w-btn recharge-btn" onclick="playSound('click'); alert('Recharge UPI: mohitcsc@jio')">Deposit</button>
                    <button class="w-btn withdraw-btn" onclick="playSound('click'); alert('Minimum withdrawal ₹110')">Withdraw</button>
                    <button class="w-btn" style="background:#64748b; color:white;" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- TIMER -->
            <div class="timer-card">
                <div class="period-info">
                    <div>Win Go 30s</div>
                    <div id="period-id">20260905001</div>
                </div>
                <div>
                    <div style="font-size: 11px; color: #94a3b8; text-align: right; margin-bottom: 2px;">Left Time</div>
                    <div class="countdown" id="timer">00:30</div>
                </div>
            </div>

            <!-- COLOR BET BUTTONS -->
            <div class="color-btns">
                <button class="c-btn btn-green" onclick="openBetModal('Green')">Join Green</button>
                <button class="c-btn btn-violet" onclick="openBetModal('Violet')">Join Violet</button>
                <button class="c-btn btn-red" onclick="openBetModal('Red')">Join Red</button>
            </div>

            <!-- NUMBERS GRID -->
            <div class="number-grid">
                <button class="num-btn num-0" onclick="openBetModal('0')">0</button>
                <button class="num-btn num-green" onclick="openBetModal('1')">1</button>
                <button class="num-btn num-red" onclick="openBetModal('2')">2</button>
                <button class="num-btn num-green" onclick="openBetModal('3')">3</button>
                <button class="num-btn num-red" onclick="openBetModal('4')">4</button>
                <button class="num-btn num-5" onclick="openBetModal('5')">5</button>
                <button class="num-btn num-red" onclick="openBetModal('6')">6</button>
                <button class="num-btn num-green" onclick="openBetModal('7')">7</button>
                <button class="num-btn num-red" onclick="openBetModal('8')">8</button>
                <button class="num-btn num-green" onclick="openBetModal('9')">9</button>
            </div>

            <!-- GAME HISTORY TABLE -->
            <div class="history-title">Game Record</div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Period</th>
                        <th>Number</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>

    </div>

    <!-- BETTING MODAL -->
    <div class="modal" id="bet-modal">
        <div class="modal-box">
            <div style="font-size: 18px; margin-bottom: 15px;">Select <span id="selected-selection" style="color:#3b82f6;"></span></div>
            <div style="font-size: 12px; color: #94a3b8;">Contract Money</div>
            <div class="amount-options">
                <button class="amt-btn active" onclick="setBetAmount(10, this)">₹10</button>
                <button class="amt-btn" onclick="setBetAmount(100, this)">₹100</button>
                <button class="amt-btn" onclick="setBetAmount(500, this)">₹500</button>
                <button class="amt-btn" onclick="setBetAmount(1000, this)">₹1000</button>
            </div>
            <button class="confirm-btn" onclick="confirmBet()">Confirm Bet</button>
            <button style="background:none; border:none; color:#94a3b8; margin-top:10px; cursor:pointer;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = null;
        let users = JSON.parse(localStorage.getItem("game_users")) || {};
        let gameHistory = JSON.parse(localStorage.getItem("game_history")) || [];

        let timeLeft = 30;
        let periodNumber = parseInt(localStorage.getItem("period_id")) || 20260905001;
        let currentBet = null;
        let selectedAmount = 10;

        // WEB AUDIO SOUND SYNTHESIS
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // AUTO-LOGIN CHECK ON LOAD
        window.onload = function() {
            let loggedInUser = localStorage.getItem("current_logged_user");
            if (loggedInUser && users[loggedInUser]) {
                currentUser = loggedInUser;
                showGameScreen();
            }
            renderHistory();
        };

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("auth-title").innerText = isRegisterMode ? "Register New ID" : "Member Login";
            document.getElementById("main-auth-btn").innerText = isRegisterMode ? "Register" : "Login";
            document.getElementById("toggle-auth-text").innerText = isRegisterMode ? "Already have an ID? Login" : "New Member? Register Here";
        }

        function handleAuth() {
            let u = document.getElementById("auth-userid").value.trim();
            let p = document.getElementById("auth-password").value.trim();

            if (!u || !p) return alert("User ID aur Password dono dalein!");

            if (isRegisterMode) {
                if (users[u]) return alert("Yeh User ID pehle se bani hui hai!");
                users[u] = { password: p, balance: 1000.00 };
                localStorage.setItem("game_users", JSON.stringify(users));
                alert("ID Successfully ban gayi hai! Ab Login karein.");
                toggleAuthMode();
            } else {
                if (!users[u] || users[u].password !== p) return alert("Galat User ID ya Password!");
                currentUser = u;
                localStorage.setItem("current_logged_user", currentUser);
                showGameScreen();
            }
        }

        function showGameScreen() {
            document.getElementById("auth-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";
            document.getElementById("user-display-id").innerText = currentUser;
            document.getElementById("user-balance").innerText = users[currentUser].balance.toFixed(2);
            document.getElementById("period-id").innerText = periodNumber;
        }

        function logout() {
            localStorage.removeItem("current_logged_user");
            location.reload();
        }

        // TIMER LOOP
        setInterval(() => {
            if (!currentUser) return;
            timeLeft--;
            let sec = timeLeft < 10 ? "0" + timeLeft : timeLeft;
            document.getElementById("timer").innerText = "00:" + sec;

            if (timeLeft === 0) {
                generateResult();
                timeLeft = 30;
                periodNumber++;
                localStorage.setItem("period_id", periodNumber);
                document.getElementById("period-id").innerText = periodNumber;
            }
        }, 1000);

        function openBetModal(selection) {
            playSound('click');
            currentBet = selection;
            document.getElementById("selected-selection").innerText = selection;
            document.getElementById("bet-modal").style.display = "flex";
        }

        function closeModal() {
            playSound('click');
            document.getElementById("bet-modal").style.display = "none";
        }

        function setBetAmount(amt, element) {
            playSound('click');
            selectedAmount = amt;
            document.querySelectorAll('.amt-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function confirmBet() {
            let userBal = users[currentUser].balance;
            if (userBal < selectedAmount) {
                playSound('lose');
                alert("Insufficient Balance!");
                closeModal();
                return;
            }

            playSound('click');
            users[currentUser].balance -= selectedAmount;
            saveUserData();
            alert(`Bet Placed for ${currentBet} with ₹${selectedAmount}`);
            closeModal();
        }

        function generateResult() {
            let winNumber = Math.floor(Math.random() * 10);
            let winColor = "";
            let dotColor = "";

            if (winNumber === 0) { winColor = "Red + Violet"; dotColor = "#9333ea"; }
            else if (winNumber === 5) { winColor = "Green + Violet"; dotColor = "#9333ea"; }
            else if ([1, 3, 7, 9].includes(winNumber)) { winColor = "Green"; dotColor = "#16a34a"; }
            else { winColor = "Red"; dotColor = "#dc2626"; }

            if (currentBet) {
                let isWin = false;
                if (currentBet === winColor || currentBet == winNumber || (currentBet === "Green" && winColor.includes("Green")) || (currentBet === "Red" && winColor.includes("Red"))) {
                    isWin = true;
                }

                if (isWin) {
                    let winAmt = selectedAmount * 1.98;
                    users[currentUser].balance += winAmt;
                    playSound('win');
                    alert(`🎉 You Won ₹${winAmt.toFixed(2)}!`);
                } else {
                    playSound('lose');
                    alert(`❌ You Lost ₹${selectedAmount}`);
                }
                saveUserData();
                currentBet = null;
            }

            // Save History
            gameHistory.unshift({ period: periodNumber, num: winNumber, color: winColor, dot: dotColor });
            if(gameHistory.length > 20) gameHistory.pop();
            localStorage.setItem("game_history", JSON.stringify(gameHistory));
            renderHistory();
        }

        function renderHistory() {
            let tbody = document.getElementById("history-body");
            tbody.innerHTML = "";
            gameHistory.forEach(item => {
                let row = `<tr>
                    <td>${item.period}</td>
                    <td style="font-weight:bold;">${item.num}</td>
                    <td><span class="dot" style="background:${item.dot};"></span> ${item.color}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function saveUserData() {
            localStorage.setItem("game_users", JSON.stringify(users));
            document.getElementById("user-balance").innerText = users[currentUser].balance.toFixed(2);
        }
    </script>
</body>
</html>
