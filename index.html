<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birth Certificate Generator</title>
  <!-- HTML2PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Georgia', serif; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    .form-container { background: #1e293b; color: #fff; width: 100%; max-width: 600px; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 30px; font-family: sans-serif; }
    .form-container h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; background: #2563eb; color: white; margin-top: 10px; }
    .btn-green { background: #16a34a; margin-top: 15px; }

    /* Certificate Layout Design */
    .certificate-wrapper { display: none; width: 100%; max-width: 800px; background: #fff; padding: 15px; }
    .certificate-border { border: 10px solid #1e3a8a; outline: 3px double #1e3a8a; outline-offset: -8px; padding: 40px; background: #fdfcf7; text-align: center; position: relative; }
    .cert-title { font-size: 38px; color: #1e3a8a; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; border-bottom: 2px solid #1e3a8a; display: inline-block; padding-bottom: 5px; }
    .cert-subtitle { font-size: 16px; color: #555; margin-bottom: 30px; font-style: italic; }
    
    .cert-body { text-align: left; margin-top: 20px; line-height: 2; font-size: 16px; }
    .cert-row { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px dashed #999; padding-bottom: 5px; }
    .cert-label { font-weight: bold; color: #1e3a8a; }
    .cert-value { color: #111; font-weight: bold; }

    .cert-footer { margin-top: 50px; display: flex; justify-content: space-between; align-items: flex-end; }
    .signature-box { text-align: center; border-top: 1px solid #333; width: 180px; padding-top: 5px; font-size: 14px; }
    .gold-seal { width: 80px; height: 80px; background: radial-gradient(circle, #facc15, #ca8a04); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); text-transform: uppercase; border: 2px dashed #fff; }
  </style>
</head>
<body>

<!-- Form Section -->
<div class="form-container">
  <h2>Birth Certificate Form</h2>
  <div class="form-group">
    <label>Child's Full Name (बच्चे का पूरा नाम)</label>
    <input type="text" id="childName" placeholder="e.g. Rahul Sharma">
  </div>
  <div class="form-group">
    <label>Date of Birth (जन्मतिथि)</label>
    <input type="date" id="dob">
  </div>
  <div class="form-group">
    <label>Father's Name (पिता का नाम)</label>
    <input type="text" id="fatherName" placeholder="e.g. Suresh Sharma">
  </div>
  <div class="form-group">
    <label>Mother's Name (माता का नाम)</label>
    <input type="text" id="motherName" placeholder="e.g. Anita Sharma">
  </div>
  <div class="form-group">
    <label>Place of Birth (जन्म स्थान)</label>
    <input type="text" id="placeName" placeholder="e.g. New Delhi">
  </div>
  
  <button class="btn" onclick="generateCertificate()">Generate Certificate</button>
</div>

<!-- Printable Certificate Layout -->
<div id="certificateTarget" class="certificate-wrapper">
  <div class="certificate-border">
    <div class="cert-title">Birth Certificate</div>
    <div class="cert-subtitle">Official Record of Birth</div>

    <div class="cert-body">
      <div class="cert-row">
        <span class="cert-label">Child's Name:</span>
        <span class="cert-value" id="outChildName">-</span>
      </div>
      <div class="cert-row">
        <span class="cert-label">Date of Birth:</span>
        <span class="cert-value" id="outDob">-</span>
      </div>
      <div class="cert-row">
        <span class="cert-label">Father's Name:</span>
        <span class="cert-value" id="outFatherName">-</span>
      </div>
      <div class="cert-row">
        <span class="cert-label">Mother's Name:</span>
        <span class="cert-value" id="outMotherName">-</span>
      </div>
      <div class="cert-row">
        <span class="cert-label">Place of Birth:</span>
        <span class="cert-value" id="outPlaceName">-</span>
      </div>
    </div>

    <div class="cert-footer">
      <div class="signature-box">Registrar Signature</div>
      <div class="gold-seal">OFFICIAL<br>SEAL</div>
      <div class="signature-box">Date of Issue</div>
    </div>
  </div>
</div>

<button id="pdfBtn" class="btn btn-green" style="display:none; max-width:600px;" onclick="downloadPDF()">📄 Download PDF Certificate</button>

<script>
  function generateCertificate() {
    const child = document.getElementById('childName').value.trim();
    const dob = document.getElementById('dob').value;
    const father = document.getElementById('fatherName').value.trim();
    const mother = document.getElementById('motherName').value.trim();
    const place = document.getElementById('placeName').value.trim();

    if(!child || !dob || !father || !mother || !place) {
      alert('कृपया सभी जानकारी भरें!');
      return;
    }

    document.getElementById('outChildName').innerText = child;
    document.getElementById('outDob').innerText = dob;
    document.getElementById('outFatherName').innerText = father;
    document.getElementById('outMotherName').innerText = mother;
    document.getElementById('outPlaceName').innerText = place;

    document.getElementById('certificateTarget').style.display = 'block';
    document.getElementById('pdfBtn').style.display = 'block';
  }

  function downloadPDF() {
    const element = document.getElementById('certificateTarget');
    const childName = document.getElementById('outChildName').innerText;
    
    const options = {
      margin:       5,
      filename:     `Birth_Certificate_${childName}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    html2pdf().set(options).from(element).save();
  }
</script>

</body>
</html>
