<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Login & Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-card { width: 100%; max-width: 400px; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); position: relative; }
    .header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 30px 20px; text-align: center; }
    .form-container { padding: 20px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; margin-top: 10px; }
    .btn-orange { background: #ff7043; }
    .btn-blue { background: #2a5298; }
    .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
    .toggle-text span { color: #2a5298; cursor: pointer; font-weight: bold; }
    
    /* Dashboard Styles */
    .dashboard { display: none; padding: 20px; }
    .user-profile { background: #2a5298; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .menu-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; font-size: 15px; }
  </style>
</head>
<body>

<div class="mobile-card">
  
  <!-- Auth Section -->
  <div id="authSection">
    <div class="header">
      <h2 id="formTitle">Welcome / स्वागत है</h2>
    </div>
    <div class="form-container">
      <div class="input-group">
        <label>Phone Number / Email</label>
        <input type="text" id="userInput" placeholder="Enter details">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Password">
      </div>
      <button class="btn btn-orange" onclick="handleAuth()" id="submitBtn">Login / लॉगिन</button>
      <div class="toggle-text">
        <span id="toggleMsg">Account नहीं है? Register करें</span>
      </div>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboardSection" class="dashboard">
    <div class="user-profile">
      <h3>ID: <span id="displayId">1265047</span></h3>
      <p>Account: <span id="displayUser"></span></p>
    </div>
    <div class="menu-item"><span>My Assets</span> ❯</div>
    <div class="menu-item"><span>My Bill</span> ❯</div>
    <div class="menu-item"><span>Bank Card</span> ❯</div>
    <button class="btn btn-blue" onclick="logout()" style="margin-top:20px;">Log out</button>
  </div>

</div>

<script>
  let isLoginMode = true;

  // Form Mode Toggle (Login/Register)
  document.getElementById('toggleMsg').addEventListener('click', () => {
    isLoginMode = !isLoginMode;
    document.getElementById('formTitle').innerText = isLoginMode ? 'Welcome / स्वागत है' : 'Register / रजिस्टर करें';
    document.getElementById('submitBtn').innerText = isLoginMode ? 'Login / लॉगिन' : 'Register / रजिस्टर';
    document.getElementById('toggleMsg').innerText = isLoginMode ? 'Account नहीं है? Register करें' : 'पहले से अकाउंट है? Login करें';
  });

  // Handle Authentication (Using Local Storage for basic implementation)
  function handleAuth() {
    const user = document.getElementById('userInput').value.trim();
    const pass = document.getElementById('passwordInput').value.trim();

    if(!user || !pass) {
      alert('कृपया दोनों फ़ील्ड भरें!');
      return;
    }

    let usersDB = JSON.parse(localStorage.getItem('registeredUsers')) || {};

    if(isLoginMode) {
      // Login Logic
      if(usersDB[user] && usersDB[user] === pass) {
        showDashboard(user);
      } else {
        alert('गलत यूज़रनेम या पासवर्ड!');
      }
    } else {
      // Register Logic
      if(usersDB[user]) {
        alert('यह यूज़र पहले से मौजूद है!');
      } else {
        usersDB[user] = pass;
        localStorage.setItem('registeredUsers', JSON.stringify(usersDB));
        alert('Registration सफल रहा! अब Login करें।');
        document.getElementById('toggleMsg').click();
      }
    }
  }

  function showDashboard(username) {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';
    document.getElementById('displayUser').innerText = username;
  }

  function logout() {
    document.getElementById('dashboardSection').style.display = 'none';
    document.getElementById('authSection').style.display = 'block';
    document.getElementById('userInput').value = '';
    document.getElementById('passwordInput').value = '';
  }
</script>

</body>
</html>
